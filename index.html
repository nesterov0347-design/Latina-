<style>
  :root {
    --bg: #eef3f4;
    --surface: #fbfdfd;
    --ink: #15262d;
    --muted: #5d7077;
    --line: #cddadd;
    --accent: #1d6b75;
    --accent-ink: #ffffff;
    --good: #2c7a4b;
    --bad: #b3363c;
    --serif: "Spectral", "Georgia", "Times New Roman", serif;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a1e; --surface: #17262b; --ink: #e6eef0; --muted: #8fa3aa;
      --line: #2a3d44; --accent: #5cb6c2; --accent-ink: #0b1519; --good: #6cc48f; --bad: #ef7f84;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a1e; --surface: #17262b; --ink: #e6eef0; --muted: #8fa3aa;
    --line: #2a3d44; --accent: #5cb6c2; --accent-ink: #0b1519; --good: #6cc48f; --bad: #ef7f84;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 0; letter-spacing: .01em; }
  .stats { color: var(--muted); font-size: .875rem; text-align: right; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  nav button {
    flex: 1; background: none; border: 0; border-bottom: 3px solid transparent;
    padding: 10px 4px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer;
  }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .card:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  .dir { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: .875rem; color: var(--muted); }
  .dir select { font: inherit; font-size: .875rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; max-width: 60%; }
  .dir button { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .875rem; cursor: pointer; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    min-height: 260px; padding: 28px 22px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; cursor: pointer;
    box-shadow: 0 1px 0 var(--line), 0 12px 24px -18px rgba(10, 30, 36, .35);
    perspective: 800px;
  }
  .card .main { font-family: var(--serif); font-size: clamp(2rem, 9vw, 2.75rem); font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
  .card .main.long { font-size: clamp(1.35rem, 6vw, 1.85rem); }
  .card .main.ru { font-family: var(--sans); font-size: clamp(1.5rem, 7vw, 2rem); font-weight: 500; }
  .card .info { margin-top: 10px; font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--muted); }
  .card .sub { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); width: 100%; max-width: 320px; }
  .card .sub .la { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; }
  .card .hint { margin-top: 22px; font-size: .8125rem; color: var(--muted); }
  .card.flip { animation: flip .28s ease; }
  @keyframes flip { from { transform: rotateX(70deg); opacity: .4; } to { transform: rotateX(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card.flip { animation: none; } }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .btn {
    font: inherit; font-weight: 600; border-radius: 12px; padding: 14px 12px; cursor: pointer;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn.good { border-color: var(--good); color: var(--good); }
  .btn.bad { border-color: var(--bad); color: var(--bad); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .kbd { margin-top: 14px; text-align: center; color: var(--muted); font-size: .8125rem; }

  .empty { text-align: center; padding: 36px 8px; }
  .empty h2 { font-family: var(--serif); margin: 0 0 8px; font-size: 1.5rem; }
  .empty p { color: var(--muted); margin: 0 0 18px; }
  .empty .btn { margin: 4px; }

  section.panel { margin-bottom: 28px; }
  h2.sec { font-family: var(--serif); font-size: 1.2rem; margin: 0 0 10px; }
  label { display: block; font-size: .875rem; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .help { font-size: .8125rem; color: var(--muted); margin: 6px 0 10px; }
  .list { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { font-family: var(--serif); font-size: 1.05rem; }
  .item .t i { font-family: var(--serif); color: var(--muted); }
  .item .t div { color: var(--muted); font-size: .875rem; overflow-wrap: anywhere; }
  .item .box { font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .item button { background: none; border: 0; color: var(--bad); cursor: pointer; font: inherit; font-size: .875rem; padding: 6px; }
  .danger { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: .875rem; cursor: pointer; padding: 6px 0; }
  .msg { font-size: .875rem; color: var(--good); min-height: 1.2em; margin-top: 6px; }
  .msg.err { color: var(--bad); }
  .card.static { cursor: default; }
  .verdict { font-weight: 600; margin-bottom: 10px; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  .x { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
  .m { color: var(--good); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  .cmp { font-family: var(--serif); font-size: 1.5rem; margin: 4px 0 10px; overflow-wrap: anywhere; }
  .cmp small { display: block; font-family: var(--sans); font-size: .8125rem; color: var(--muted); }
  input.spin { margin-top: 14px; font-family: var(--serif); font-size: 1.5rem; text-align: center; padding: 14px 12px; }
  .check { display: flex; gap: 8px; align-items: center; cursor: pointer; margin: 0; font-size: .875rem; }
  .dir label.check { color: var(--muted); }
</style>

  function makeCourse() {
    var out = [];
    LESSONS.forEach(function (L, li) {
      L[1].forEach(function (r, i) {
        out.push({ id: "c" + li + "-" + i, la: r[0], info: r[1], ru: r[2], tag: L[0], box: 0, due: 0 });
      });
    });
    EXPRESSIONS.forEach(function (r, i) {
      out.push({ id: "e" + i, la: r[0], info: "", ru: r[1], tag: r[2], box: 0, due: 0 });
    });
    return out;
  }
  function cardKey(c) { return String(c.tag || "") + "|" + String(c.la).toLowerCase() + "|" + String(c.ru).toLowerCase(); }
  function wordKey(c) { return String(c.la).toLowerCase() + "|" + String(c.info || "").toLowerCase() + "|" + String(c.ru).toLowerCase(); }
  function migrate(ver) {
    var progress = {};
    if (ver < 2) {
      var oldKeys = {};
      OLD_STARTER.forEach(function (r) { oldKeys[r[0].toLowerCase() + "|" + r[2].toLowerCase()] = 1; });
      cards = cards.filter(function (c) {
        if (!c.tag && oldKeys[String(c.la).toLowerCase() + "|" + String(c.ru).toLowerCase()]) { progress[String(c.la).toLowerCase()] = c; return false; }
        return true;
      });
    }
    if (ver < 4) {
      var exprTag = {};
      EXPRESSIONS.forEach(function (r) { if (!exprTag[r[0].toLowerCase()]) exprTag[r[0].toLowerCase()] = r[2]; });
      cards.forEach(function (c) {
        var m = /^Занятие (\d+)$/.exec(c.tag || "");
        if (m) c.tag = "I сем · занятие " + m[1];
        else if (c.tag === "Выражения") c.tag = exprTag[String(c.la).toLowerCase()] || c.tag;
      });
    }
    var have = {};
    cards.forEach(function (c) { if (!have[cardKey(c)]) have[cardKey(c)] = c; });
    var used = {}, ids = {};
    var merged = makeCourse().map(function (c) {
      var e = have[cardKey(c)];
      if (e) { used[e.id] = 1; return e; }
      var p = progress[c.la.toLowerCase()];
      if (p) { c.box = p.box; c.due = p.due; }
      return c;
    });
    var rest = cards.filter(function (c) { return !used[c.id]; });
    cards = merged.concat(rest);
    cards.forEach(function (c) { if (ids[c.id]) c.id = uid(); ids[c.id] = 1; });
    save();
  }

  function load() {

  }

  function byId(id) { for (var i = 0; i < cards.length; i++) if (cards[i].id === id) return cards[i]; return null; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function uniq(list) {
    var seen = {};
    return list.filter(function (c) { var k = wordKey(c); if (seen[k]) return false; seen[k] = 1; return true; });
  }
  function pool() {
    if (filter === "all") return uniq(cards);
    if (filter === "__miss") return uniq(cards.filter(function (c) { return c.miss > 0; }));
    return cards.filter(function (c) {
      if (filter === "mine") return !c.tag;
      return c.tag === filter;
    });
  }
  function tagList() {
    var tags = [];
    cards.forEach(function (c) { var t = c.tag || "mine"; if (tags.indexOf(t) < 0) tags.push(t); });
    return tags;
  }
  function tagName(t) { return t === "mine" ? "Мои слова" : t; }
  function dueCards() { var now = Date.now(); return pool().filter(function (c) { return c.due <= now; }); }
  function tagTitle(t) {
    var m = /^(I{1,2}) сем · (.+)$/.exec(t);
    return m ? m[2].charAt(0).toUpperCase() + m[2].slice(1) : tagName(t);
  }
  function filterSelect() {
    var tags = tagList();
    var missN = uniq(cards.filter(function (c) { return c.miss > 0; })).length;
    if (filter === "__miss" && !missN) filter = "all";
    if (filter !== "all" && filter !== "__miss" && tags.indexOf(filter) < 0) filter = "all";
    function opt(val, label) { return '<option value="' + esc(val) + '"' + (filter === val ? " selected" : "") + '>' + esc(label) + '</option>'; }
    function count(t) { return cards.filter(function (c) { return (c.tag || "mine") === t; }).length; }
    var html = '<div class="dir" style="margin-bottom:10px"><label for="flt" style="margin:0">Что учим</label><select id="flt">' +
      opt("all", "Всё (" + uniq(cards).length + ")");
    [["I сем", "I семестр"], ["II сем", "II семестр"]].forEach(function (g) {
      var list = tags.filter(function (t) { return t.indexOf(g[0] + " ·") === 0; });
      if (!list.length) return;
      html += '<optgroup label="' + g[1] + '">' + list.map(function (t) { return opt(t, tagTitle(t) + " (" + count(t) + ")"); }).join("") + '</optgroup>';
    });
    var other = tags.filter(function (t) { return !/^II? сем ·/.test(t); });
    other.forEach(function (t) { html += opt(t, tagName(t) + " (" + count(t) + ")"); });
    if (missN) html += opt("__miss", "С ошибками (" + missN + ")");
    return html + '</select></div>';
  }
  function bindFilter() {
    var f = document.getElementById("flt");
    if (f) f.onchange = function () { filter = f.value; save(); startSession(false); startSpelling(); render(); };
  }

  function startSession(all) {
    var src = all ? pool().slice() : dueCards();
    session = shuffle(src).map(function (c) { return c.id; });
    total = session.length; done = 0; wrongCount = 0; shown = false;
  }

  function answer(ok) {
    var id = session.shift();
    var c = byId(id);
    if (c) {
      if (ok) {
        c.box = Math.min(c.box + 1, MAX_BOX);
        c.due = Date.now() + INTERVALS[c.box] * DAY;
        done++;
      } else {
        c.box = 0;
        c.due = Date.now() + 10 * 60000;
        session.push(id);
        wrongCount++;
      }
    }
    shown = false;
    save();
    render();
  }

  function flip() {
    if (!session.length) return;
    shown = !shown;
    render(true);
  }

  var statsEl = document.getElementById("stats");
  var view = document.getElementById("view");

  function renderStats() {
    var learned = cards.filter(function (c) { return c.box >= MAX_BOX; }).length;
    statsEl.textContent = "Карточек: " + uniq(cards).length + " · выучено: " + uniq(cards).filter(function (c) { return c.box >= MAX_BOX; }).length;
  }

  function renderStudy(animate) {
    if (!cards.length) {
      view.innerHTML = '<div class="empty"><h2>Пока нет слов</h2><p>Добавь слова на вкладке «Мои слова».</p></div>';
      return;
    }
    if (!session.length) {
      var due = dueCards().length;
      var html = '<div class="empty">';
      if (total > 0 && done > 0) {
        html += '<h2>Подход закончен</h2><p>Выучено в этом подходе: ' + done + '. Ошибок: ' + wrongCount + '.</p>';
      } else if (due === 0) {
        html += '<h2>На сегодня всё</h2><p>Все слова повторены. Следующие появятся по расписанию.</p>';
      } else {
        html += '<h2>Готов?</h2><p>К повторению сейчас: ' + due + '.</p>';
      }
      if (due > 0) html += '<button class="btn primary" id="go-due">Повторить (' + due + ')</button>';
      html += '<button class="btn" id="go-all">Пройти всю колоду</button></div>';
      view.innerHTML = filterSelect() + html;
      bindFilter();
      var d = document.getElementById("go-due"); if (d) d.onclick = function () { startSession(false); render(); };
      document.getElementById("go-all").onclick = function () { startSession(true); render(); };
      return;
    }
    var c = byId(session[0]);
    var pct = total ? Math.round((done / total) * 100) : 0;
    var front, back;
    if (!reverse) {
      front = '<div class="main' + (c.la.length > 16 ? ' long' : '') + '">' + esc(c.la) + '</div>' + (c.info ? '<div class="info">' + esc(c.info) + '</div>' : '');
    } else {
      front = '<div class="main ru">' + esc(c.ru) + '</div>';
    }
    var body;
    if (!shown) {
      body = front + '<div class="hint">Нажми, чтобы увидеть ответ</div>';
    } else if (!reverse) {
      body = front + '<div class="sub"><div class="main ru" style="font-size:1.6rem">' + esc(c.ru) + '</div></div>';
    } else {
      body = front + '<div class="sub"><div class="la">' + esc(c.la) + '</div>' + (c.info ? '<div class="info" style="margin-top:4px">' + esc(c.info) + '</div>' : '') + '</div>';
    }
    var html2 =
      filterSelect() + '<div class="dir"><span>Осталось: ' + session.length + '</span>' +
      '<button id="dir-btn">' + (reverse ? 'Русский → латынь' : 'Латынь → русский') + '</button></div>' +
      '<div class="progress" aria-hidden="true"><div style="width:' + pct + '%"></div></div>' +
      '<div class="card' + (animate ? ' flip' : '') + '" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку">' + body + '</div>' +
      '<div class="answers">' +
        '<button class="btn bad" id="no"' + (shown ? '' : ' disabled') + '>Не знаю</button>' +
        '<button class="btn good" id="yes"' + (shown ? '' : ' disabled') + '>Знаю</button>' +
      '</div>' +
      '<div class="kbd">Пробел — перевернуть · 1 — не знаю · 2 — знаю</div>';
    view.innerHTML = html2;
    bindFilter();
    document.getElementById("card").onclick = flip;
    document.getElementById("yes").onclick = function () { if (shown) answer(true); };
    document.getElementById("no").onclick = function () { if (shown) answer(false); };
    document.getElementById("dir-btn").onclick = function () { reverse = !reverse; shown = false; save(); render(); };
  }

  function boxLabel(b) { return b >= MAX_BOX ? "выучено" : "уровень " + b; }

  function renderDeck() {
    var html = '';
    html += '<section class="panel"><h2 class="sec">Добавить слово</h2>' +
      '<label for="f-la">Латинское слово</label><input type="text" id="f-la" autocomplete="off" autocapitalize="off">' +
      '<div class="row"><div><label for="f-info">Родительный падеж, род</label><input type="text" id="f-info" placeholder="capitis, n" autocomplete="off" autocapitalize="off"></div>' +
      '<div><label for="f-ru">Перевод</label><input type="text" id="f-ru" autocomplete="off"></div></div>' +
      '<div style="margin-top:12px"><button class="btn primary" id="add">Добавить</button></div>' +
      '<div class="msg" id="msg-add" role="status"></div></section>';

    html += '<section class="panel"><h2 class="sec">Вставить списком</h2>' +
      '<label for="bulk">По одному слову в строке</label>' +
      '<textarea id="bulk" placeholder="caput | capitis, n | голова&#10;vena — вена"></textarea>' +
      '<div class="help">Формат: <b>слово | родительный, род | перевод</b> или короче: <b>слово — перевод</b>.</div>' +
      '<button class="btn" id="import">Добавить из списка</button>' +
      '<div class="msg" id="msg-imp" role="status"></div></section>';

    html += '<section class="panel"><h2 class="sec">Все слова (' + cards.length + ')</h2>';
    if (cards.length) {
      html += '<div class="list">' + cards.map(function (c) {
        return '<div class="item"><div class="t"><b>' + esc(c.la) + '</b>' + (c.info ? ' <i>' + esc(c.info) + '</i>' : '') +
          '<div>' + esc(c.ru) + '</div></div><span class="box">' + (c.tag ? esc(tagTitle(c.tag)) + ' · ' : '') + boxLabel(c.box) + (c.miss ? ' · ошибок: ' + c.miss : '') + '</span>' +
          '<button data-del="' + c.id + '" aria-label="Удалить слово ' + esc(c.la) + '">Удалить</button></div>';
      }).join('') + '</div>';
    } else {
      html += '<p class="help">Список пуст.</p>';
    }
    html += '<div style="margin-top:12px"><button class="danger" id="reset-progress">Сбросить прогресс</button> ' +
      '&nbsp; <button class="danger" id="reset-all">Вернуть слова курса</button></div></section>';
    html += '<section class="panel"><h2 class="sec">О приложении</h2>' +
      '<div class="help" style="font-size:.875rem;line-height:1.55">' +
      'Слова и выражения взяты из пособия «Latina medica» (СамГМУ, 2023), лексические минимумы занятий I и II семестров. ' +
      'Очевидные опечатки пособия исправлены (например, squama, vertebra). Слова из практических заданий без перевода не включены.<br><br>' +
      'Прогресс хранится только в этом браузере на этом устройстве. Если очистить данные сайта, он пропадёт.<br><br>' +
      '<b>Как поставить на экран телефона.</b> iPhone: Safari → «Поделиться» → «На экран “Домой”». Android: Chrome → меню ⋯ → «Добавить на главный экран».' +
      '</div></section>';
    view.innerHTML = html;

    var msgAdd = document.getElementById("msg-add");
    document.getElementById("add").onclick = function () {
      var la = document.getElementById("f-la").value.trim();
      var info = document.getElementById("f-info").value.trim();
      var ru = document.getElementById("f-ru").value.trim();
      if (!la || !ru) { msgAdd.className = "msg err"; msgAdd.textContent = "Заполни латинское слово и перевод."; return; }
      cards.push({ id: uid(), la: la, info: info, ru: ru, box: 0, due: 0 });
      save(); session = []; total = 0; done = 0; spDirty = true;
      flashMsg = "Добавлено: " + la;
      render();
    };

    document.getElementById("import").onclick = function () {
      var txt = document.getElementById("bulk").value;
      var lines = txt.split(/\r?\n/);
      var added = 0;
      lines.forEach(function (line) {
        line = line.trim(); if (!line) return;
        var parts;
        if (line.indexOf("|") >= 0) parts = line.split("|");
        else if (line.indexOf("\t") >= 0) parts = line.split("\t");
        else parts = line.split(/\s+[—–-]\s+/);
        parts = parts.map(function (p) { return p.trim(); });
        var la, info = "", ru;
        if (parts.length >= 3) { la = parts[0]; info = parts[1]; ru = parts.slice(2).join(" "); }
        else if (parts.length === 2) { la = parts[0]; ru = parts[1]; }
        if (la && ru) { cards.push({ id: uid(), la: la, info: info, ru: ru, box: 0, due: 0 }); added++; }
      });
      var m = document.getElementById("msg-imp");
      if (!added) { m.className = "msg err"; m.textContent = "Не удалось разобрать строки. Проверь формат."; return; }
      save(); session = []; total = 0; done = 0; spDirty = true;
      flashMsg = "Добавлено слов: " + added;
      render();
    };

    Array.prototype.forEach.call(view.querySelectorAll("[data-del]"), function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-del");
        cards = cards.filter(function (c) { return c.id !== id; });
        session = session.filter(function (x) { return x !== id; }); spDirty = true;
        save(); render();
      };
    });
    document.getElementById("reset-progress").onclick = function () {
      if (!confirm("Сбросить прогресс по всем словам?")) return;
      cards.forEach(function (c) { c.box = 0; c.due = 0; c.miss = 0; });
      session = []; total = 0; done = 0; spDirty = true; save(); render();
    };
    document.getElementById("reset-all").onclick = function () {
      if (!confirm("Заменить все слова словами курса (занятия 1–4)? Добавленные тобой слова будут удалены.")) return;
      cards = makeCourse(); filter = "all";
      session = []; total = 0; done = 0; spDirty = true; save(); render();
    };

    if (flashMsg) {
      var target = document.getElementById("msg-add");
      target.className = "msg"; target.textContent = flashMsg; flashMsg = "";
    }
  }

  // ---------- Проверка правописания ----------
  var sp = { queue: [], total: 0, first: 0, tried: {}, mistakes: [], checked: false, ok: false, typed: "", cur: null, hint: 0, firstTry: false };

  function fold(str) {
    return String(str).toLowerCase().replace(/æ/g, "ae").replace(/œ/g, "oe").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function norm(str) {
    return fold(str).replace(/[.,;:!?«»"“”()\u2014\u2013\-*]/g, " ").replace(/\s+/g, " ").trim();
  }
  function normNoParen(str) { return norm(String(str).replace(/\([^)]*\)/g, " ")); }
  function sameText(a, b) { return norm(a) === norm(b) || normNoParen(a) === normNoParen(b); }
  function targetOf(c) { return fullForm && c.info ? c.la + ", " + c.info : c.la; }

  function startSpelling() {
    sp = { queue: shuffle(pool().map(function (c) { return c.id; })), total: 0, first: 0, tried: {}, mistakes: [], checked: false, ok: false, typed: "", cur: null, hint: 0, firstTry: false };
    sp.total = sp.queue.length;
  }

  function diffHtml(typed, target) {
    var a = typed.split(""), b = target.split("");
    var n = a.length, m = b.length, i, j;
    var dp = [];
    for (i = 0; i <= n; i++) { dp.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        dp[i][j] = fold(a[i]) === fold(b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var ma = new Array(n).fill(false), mb = new Array(m).fill(false);
    i = 0; j = 0;
    while (i < n && j < m) {
      if (fold(a[i]) === fold(b[j])) { ma[i] = true; mb[j] = true; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    var th = a.map(function (ch, k) { return ma[k] ? esc(ch) : '<span class="x">' + esc(ch === " " ? "\u00a0" : ch) + '</span>'; }).join("");
    var ch2 = b.map(function (ch, k) { return mb[k] ? esc(ch) : '<span class="m">' + esc(ch === " " ? "\u00a0" : ch) + '</span>'; }).join("");
    return { typed: th, target: ch2 };
  }

  function spCheck() {
    var inp = document.getElementById("sp-in");
    if (!inp || !inp.value.trim() || !sp.queue.length) return;
    var c = byId(sp.queue[0]);
    if (!c) return;
    var target = targetOf(c);
    sp.cur = c.id;
    sp.typed = inp.value.trim();
    sp.ok = sameText(sp.typed, target);
    sp.checked = true;
    sp.firstTry = !sp.tried[c.id];
    sp.tried[c.id] = true;
    if (sp.ok) {
      if (sp.firstTry) { sp.first++; if (c.miss) c.miss = Math.max(0, c.miss - 1); }
      sp.queue.shift();
    } else {
      c.miss = (c.miss || 0) + 1;
      sp.mistakes.push({ id: c.id, target: target, typed: sp.typed });
      sp.queue.push(sp.queue.shift());
    }
    save(); render();
  }

  function spOverride() {
    var c = byId(sp.cur);
    var k = sp.queue.lastIndexOf(sp.cur);
    if (k >= 0) sp.queue.splice(k, 1);
    sp.mistakes.pop();
    if (c && c.miss) c.miss = Math.max(0, c.miss - 1);
    if (sp.firstTry) sp.first++;
    save(); spNext();
  }

  function spNext() { sp.checked = false; sp.typed = ""; sp.hint = 0; render(); }

  function spHintText() {
    var c = byId(sp.queue[0]); if (!c) return "";
    var t = targetOf(c);
    if (!sp.hint) return "";
    return t.slice(0, Math.min(sp.hint, t.length)) + "… (" + t.replace(/[^A-Za-z]/g, "").length + " букв)";
  }

  function renderSpell() {
    if (!cards.length) {
      view.innerHTML = '<div class="empty"><h2>Пока нет слов</h2><p>Добавь слова на вкладке «Мои слова».</p></div>';
      return;
    }
    var html = filterSelect() +
      '<div class="dir"><label class="check"><input type="checkbox" id="sp-full"' + (fullForm ? ' checked' : '') +
      '> Писать со словарной формой (ala, ae, f)</label></div>';

    if (!sp.queue.length && !sp.checked) {
      var missN = cards.filter(function (c) { return c.miss > 0; }).length;
      html += '<div class="empty">';
      if (!sp.total) {
        html += '<h2>В этой подборке нет слов</h2><p>Выбери другую подборку выше.</p>';
      } else {
        html += '<h2>Готово</h2><p>С первой попытки: ' + sp.first + ' из ' + sp.total + '.</p>';
        var seen = {}, list = '';
        sp.mistakes.forEach(function (m) {
          if (seen[m.id]) return; seen[m.id] = 1;
          var c = byId(m.id);
          list += '<div class="item"><div class="t"><b>' + esc(m.target) + '</b><div>' + (c ? esc(c.ru) : '') +
            '</div><div>ты написал: ' + esc(m.typed) + '</div></div></div>';
        });
        if (list) html += '<div class="list" style="text-align:left;margin-bottom:16px">' + list + '</div>';
      }
      html += '<button class="btn primary" id="sp-again">Ещё раз</button>';
      if (missN) html += '<button class="btn" id="sp-miss">Только слова с ошибками (' + missN + ')</button>';
      html += '</div>';
      view.innerHTML = html;
      bindFilter(); bindFull();
      var ag = document.getElementById("sp-again"); if (ag) ag.onclick = function () { startSpelling(); render(); };
      var ms = document.getElementById("sp-miss"); if (ms) ms.onclick = function () { filter = "__miss"; save(); startSession(false); startSpelling(); render(); };
      return;
    }

    var left = sp.queue.length;
    if (!sp.checked) {
      var c = byId(sp.queue[0]);
      html += '<div class="dir"><span>Осталось: ' + left + '</span><span>' + (c.tag ? esc(c.tag) : 'Мои слова') + '</span></div>' +
        '<div class="card static"><div class="hint" style="margin:0 0 12px">Напиши по-латыни</div>' +
        '<div class="main ru">' + esc(c.ru) + '</div>' +
        '<div class="hint" id="sp-hint" style="min-height:1.4em;font-family:var(--serif);font-size:1rem">' + esc(spHintText()) + '</div></div>' +
        '<input type="text" id="sp-in" class="spin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Латинское слово">' +
        '<div class="answers"><button class="btn" id="sp-hintbtn">Подсказка</button><button class="btn primary" id="sp-check">Проверить</button></div>' +
        '<div class="kbd">Enter — проверить</div>';
      view.innerHTML = html;
      bindFilter(); bindFull();
      var inp = document.getElementById("sp-in");
      inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); spCheck(); } };
      document.getElementById("sp-check").onclick = spCheck;
      document.getElementById("sp-hintbtn").onclick = function () {
        sp.hint++;
        document.getElementById("sp-hint").textContent = spHintText();
      };
      if (inp.focus) setTimeout(function () { inp.focus(); }, 0);
    } else {
      var cur = byId(sp.cur);
      var target = cur ? targetOf(cur) : "";
      var card;
      if (sp.ok) {
        card = '<div class="card static"><div class="verdict good">Верно</div>' +
          '<div class="cmp">' + esc(target) + '</div>' +
          '<div class="sub"><div style="color:var(--muted)">' + esc(cur ? cur.ru : '') + '</div></div></div>';
      } else {
        var df = diffHtml(sp.typed, target);
        card = '<div class="card static"><div class="verdict bad">Есть ошибка</div>' +
          '<div class="cmp"><small>Ты написал</small>' + df.typed + '</div>' +
          '<div class="cmp"><small>Правильно</small>' + df.target + '</div>' +
          '<div class="sub"><div style="color:var(--muted)">' + esc(cur ? cur.ru : '') + '</div></div></div>';
      }
      html += '<div class="dir"><span>Осталось: ' + left + '</span><span>' + (cur && cur.tag ? esc(cur.tag) : 'Мои слова') + '</span></div>' + card;
      var nextLabel = left ? 'Дальше' : 'Закончить';
      if (sp.ok) html += '<div style="margin-top:16px"><button class="btn primary" id="sp-next" style="width:100%">' + nextLabel + '</button></div>';
      else html += '<div class="answers"><button class="btn" id="sp-ovr">Я был прав, засчитать</button><button class="btn primary" id="sp-next">' + nextLabel + '</button></div>';
      view.innerHTML = html;
      bindFilter(); bindFull();
      var nx = document.getElementById("sp-next");
      nx.onclick = spNext;
      var ov = document.getElementById("sp-ovr"); if (ov) ov.onclick = spOverride;
      if (nx.focus) setTimeout(function () { nx.focus(); }, 0);
    }
  }

  function bindFull() {
    var f = document.getElementById("sp-full");
    if (f) f.onchange = function () { fullForm = f.checked; save(); startSpelling(); render(); };
  }

  function render(animate) {
    renderStats();
    document.getElementById("tab-study").setAttribute("aria-selected", tab === "study");
    document.getElementById("tab-spell").setAttribute("aria-selected", tab === "spell");
    document.getElementById("tab-deck").setAttribute("aria-selected", tab === "deck");
    if (tab === "study") renderStudy(animate); else if (tab === "spell") renderSpell(); else renderDeck();
  }

  document.getElementById("tab-study").onclick = function () { tab = "study"; render(); };
  document.getElementById("tab-spell").onclick = function () {
    tab = "spell";
    if (spDirty || (!sp.total && !sp.checked)) { startSpelling(); spDirty = false; }
    render();
  };
  document.getElementById("tab-deck").onclick = function () { tab = "deck"; render(); };

  document.addEventListener("keydown", function (e) {
    if (tab !== "study" || !session.length) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === " " || e.key === "Enter") {
      if (tag === "BUTTON" && e.target.id !== "card") return;
      e.preventDefault(); flip();
    } else if (e.key === "1" && shown) { answer(false); }
    else if (e.key === "2" && shown) { answer(true); }
  });

  load();
  startSession(false);
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
